name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bun typecheck

      - name: Run tests
        run: bun test

      - name: Build project
        run: bun run build

      - name: Test binary compilation
        run: |
          # Test that we can build at least the Linux binary
          echo "Testing Linux x64 binary compilation..."
          bun build ./dist/index.js --compile --target=bun-linux-x64 --outfile test-binary
          rm test-binary
